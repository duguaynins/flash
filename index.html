<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruffle VFS Player - Direct Mapping</title>
    
    <script src="./static/js/ruffle.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #000000;
            --accent-dim: #767676;
            --height-unit: 38px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .player-card {
            width: 100%;
            max-width: 600px; /* 手機優先，直式單欄精緻比例 */
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 20px;
            box-sizing: border-box;
        }

        h2 {
            margin: 0 0 20px 0;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr; 
            gap: 16px;
            margin-bottom: 20px;
        }

        .control-section {
            display: flex;
            flex-direction: column;
        }

        .control-section label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .input-group {
            display: flex;
            width: 100%;
            height: var(--height-unit);
            box-sizing: border-box;
        }

        input[type="text"], select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-right: none;
            color: var(--text-color);
            font-family: inherit;
            padding: 0 12px;
            flex-grow: 1;
            font-size: 13px;
            outline: none;
            height: 100%;
            box-sizing: border-box;
        }

        select {
            cursor: pointer;
            border-radius: 0;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="file"] { display: none; }

        .btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            font-family: inherit;
            padding: 0 16px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            box-sizing: border-box;
            transition: background-color 0.1s, color 0.1s;
        }

        .btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        .file-mount-btn { border-left: none; }

        .blob-display-area {
            margin-top: 10px;
            margin-bottom: 10px;
            font-size: 11px;
            font-family: monospace;
            background-color: #fafafa;
            border: 1px dashed var(--border-color);
            padding: 10px;
            word-break: break-all;
            display: none;
        }

        .cache-status {
            font-size: 11px;
            color: var(--accent-dim);
            margin-top: 6px;
            font-style: italic;
        }

        #player-container {
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .placeholder-text {
            color: var(--accent-dim);
            font-size: 11px;
            letter-spacing: 1px;
        }

        #player-container ruffle-player { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>Flash VFS Controller</h2>

        <div class="control-panel">
            
            <div class="control-section">
                <label>Step 1: Mount Sources (URL or Files)</label>
                <div class="input-group">
                    <input type="text" id="url-cache-input" placeholder="https://example.com/game.swf">
                    <button class="btn" id="fetch-url-btn">Fetch</button>
                    <label class="btn file-mount-btn">
                        <input type="file" id="assets-input" accept=".swf,.mp3,.xml" multiple>
                        Files
                    </label>
                </div>
                <div class="cache-status" id="cache-info">[ VFS Drive Unmounted ]</div>
            </div>
            
            <div class="control-section">
                <label for="main-select">Step 2: Launch Selected BLOB</label>
                <div class="input-group">
                    <select id="main-select" disabled>
                        <option value="">[ Select Target SWF ]</option>
                    </select>
                    <button class="btn" id="launch-btn" disabled>Launch</button>
                </div>
            </div>

        </div>

        <div class="blob-display-area" id="blob-inspector"></div>

        <div id="player-container">
            <div class="placeholder-text">[ AWAITING VFS DRIVE MOUNT ]</div>
        </div>
    </div>

    <script>
        // 核心對照記憶體 (一律用純小寫檔名當 Key 檢索)
        const virtualFS = {}; 
        const baseOrigin = window.location.origin; // 取得當前網域，例如 http://localhost:8000

        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            publicPath: "./static/js/",
            letterbox: "on",         
            scale: "showAll",        
            forceScale: true,
            quality: "high"          
        };

        const container = document.getElementById("player-container");
        const urlCacheInput = document.getElementById("url-cache-input");
        const fetchUrlBtn = document.getElementById("fetch-url-btn");
        const assetsInput = document.getElementById("assets-input");
        const mainSelect = document.getElementById("main-select");
        const launchBtn = document.getElementById("launch-btn");
        const cacheInfo = document.getElementById("cache-info");
        const blobInspector = document.getElementById("blob-inspector");

        function updateUIStatus() {
            const totalCached = Object.keys(virtualFS).length;
            if (totalCached > 0) {
                cacheInfo.innerText = `[ Successfully Mounted ${totalCached} Files ]`;
                mainSelect.disabled = false;
                launchBtn.disabled = false;
            }
        }

        // 核心：將檔案塞入對照表，並優化下拉選單的 Name 與 Value
        function addAssetToVFS(name, rawBlobURL) {
            const lowerName = name.toLowerCase();
            
            // 釋放重複上傳的舊記憶體指標
            if (virtualFS[lowerName]) {
                URL.revokeObjectURL(virtualFS[lowerName].rawUrl);
            }

            // 完美的虛擬網址名稱：blob:http://localhost:8000/main.swf
            const targetBlobVirtualPath = `blob:${baseOrigin}/${lowerName}`;

            // 資料庫儲存結構
            virtualFS[lowerName] = {
                rawUrl: rawBlobURL,                 // VALUE: 瀏覽器底層真實的隨機 UUID Blob URL
                displayUrl: targetBlobVirtualPath // NAME:  你指定的帶有真實檔名的虛擬網址
            };

            // 如果是 SWF，直接注入下拉選單
            if (lowerName.endsWith('.swf')) {
                // 檢查是否已存在
                let option = Array.from(mainSelect.options).find(opt => opt.getAttribute('data-key') === lowerName);
                
                if (!option) {
                    option = document.createElement("option");
                    mainSelect.appendChild(option);
                }

                // 🎯 完美應對結構
                option.setAttribute('data-key', lowerName); // 綁定純檔名 Key 用於內部快速查找
                option.textContent = targetBlobVirtualPath; // 下拉選單顯示的 [NAME] >>> blob:http://.../main.swf
                option.value = rawBlobURL;                  // 下拉選單背後的 [VALUE] >>> blob:http://.../uuid-string
            }
        }

        // 下拉選單切換時顯示路徑
        mainSelect.addEventListener("change", () => {
            const rawUrl = mainSelect.value;
            // 透過 value 逆向反查對應的 displayUrl
            const found = Object.values(virtualFS).find(item => item.rawUrl === rawUrl);
            
            if (rawUrl && found) {
                blobInspector.style.display = "block";
                blobInspector.innerHTML = `<strong>TARGET BLOB PATH:</strong><br>${found.displayUrl}`;
            } else {
                blobInspector.style.display = "none";
            }
        });

        // 遠端 URL Fetch
        fetchUrlBtn.addEventListener("click", async () => {
            const url = urlCacheInput.value.trim();
            if (!url) return alert("Please enter a URL.");

            const fileName = url.split('?')[0].split('/').pop() || "remote_game.swf";
            cacheInfo.innerText = "[ Fetching remote binary... ]";

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const blob = await response.blob();
                addAssetToVFS(fileName, URL.createObjectURL(blob));
                updateUIStatus();
                urlCacheInput.value = "";
            } catch (error) {
                alert(`Fetch failed:\n${error.message}`);
                cacheInfo.innerText = "[ Fetch Failed ]";
            }
        });

        // 本地多檔案選取
        assetsInput.addEventListener("change", (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            files.forEach(file => {
                addAssetToVFS(file.name, URL.createObjectURL(file));
            });
            updateUIStatus();
        });

        // 初始化播放器並設定「無死角」相依性攔截器
        function initNewPlayer() {
            container.innerHTML = "";
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            container.appendChild(player);

            // 🌟 onInterceptURLLoad 核心解法
            player.onInterceptURLLoad = (url) => {
                try {
                    // 安全解析網址，剝離 Flash 結尾常見的隨機參數 (如 top.swf?v=123)
                    const parsedUrl = new URL(url, window.location.href);
                    const fileName = parsedUrl.pathname.split('/').pop().toLowerCase();
                    
                    if (virtualFS[fileName]) {
                        console.log(`[VFS Linked] Intercepted dependency: ${fileName}`);
                        return virtualFS[fileName].rawUrl; // 丟回真實認得的底層二進位 Blob URL
                    }
                } catch(e) {
                    // 備用降級切法
                    const fileName = url.split('?')[0].split('/').pop().toLowerCase();
                    if (virtualFS[fileName]) return virtualFS[fileName].rawUrl;
                }
                return url;
            };

            return player;
        }

        // 啟動主程式
        launchBtn.addEventListener("click", () => {
            const selectedRawBlobUrl = mainSelect.value; // 直接拿到底層真實的二進位網址 (VALUE)
            
            if (!selectedRawBlobUrl) return alert("Please select a target BLOB.");

            const player = initNewPlayer();
            
            // 從對照表中撈出顯示名稱印 Log 給你看
            const found = Object.values(virtualFS).find(item => item.rawUrl === selectedRawBlobUrl);
            console.log(`Ruffle Loading Main SWF: ${found ? found.displayUrl : selectedRawBlobUrl}`);
            
            // 傳遞底層真實認得的二進位 Blob 網址給 Ruffle 執行，徹底免除 404 與檔案找不到錯誤
            player.load({ url: selectedRawBlobUrl }); 
        });
    </script>
</body>
</html>
