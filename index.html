<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruffle VFS Player - Ultimate Weapon</title>

<script src="./static/js/ruffle.js"></script>

<style>
:root{
    --bg:#fff;
    --text:#000;
    --border:#000;
    --dim:#777;
    --h:38px;
}

body{
    margin:0;
    padding:40px 20px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;
    justify-content:center;
    background:#fff;
}

.player-card{
    width:100%;
    max-width:900px;
    border:1px solid black;
    padding:30px;
    box-sizing:border-box;
}

.control-panel{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:20px;
}

@media(max-width:768px){
    .control-panel{
        grid-template-columns:1fr;
    }
}

.control-section{
    display:flex;
    flex-direction:column;
}

label{
    font-size:11px;
    font-weight:bold;
    margin-bottom:5px;
}

.input-group{
    display:flex;
    height:var(--h);
    box-sizing:border-box;
}

input[type=text],
select{
    flex:1;
    border:1px solid black;
    border-right:none;
    padding:0 10px;
    outline:none;
    height:100%;
    box-sizing:border-box;
}

.btn{
    border:1px solid black;
    background:white;
    cursor:pointer;
    padding:0 16px;
    font-size:11px;
    font-weight:bold;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    height:100%;
    box-sizing:border-box;
}

.btn:hover{
    background:black;
    color:white;
}

.file-btn{
    border-left:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    height:100%;
    box-sizing:border-box;
}

input[type=file]{
    display:none;
}

.cache-status{
    margin-top:8px;
    font-size:11px;
    color:var(--dim);
}

#blob-inspector{
    display:none;
    margin-top:15px;
    padding:10px;
    font-family:monospace;
    font-size:11px;
    border:1px dashed black;
    background:#fafafa;
    word-break:break-all;
}

#player-container{
    margin-top:20px;
    width:100%;
    aspect-ratio:4/3;
    border:1px solid black;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

#player-container ruffle-player{
    width:100%;
    height:100%;
    display:block;
}
</style>

</head>
<body>

<div class="player-card">

    <h2>Flash BLOB Smart Mapping Test (Fixed)</h2>

    <div class="control-panel">

        <div class="control-section">

            <label>Step 1: Mount Files</label>

            <div class="input-group">

                <input
                    id="url-input"
                    type="text"
                    placeholder="https://example.com/game.swf"
                >

                <button
                    class="btn"
                    id="fetch-btn"
                >
                    Fetch
                </button>

                <label class="btn file-btn">

                    <input
                        id="files-input"
                        type="file"
                        multiple
                        accept=".swf,.mp3,.xml"
                    >

                    Files

                </label>

            </div>

            <div
                class="cache-status"
                id="cache-info"
            >
                [VFS Empty]
            </div>

        </div>


        <div class="control-section">

            <label>Step 2: Launch BLOB Direct</label>

            <div class="input-group">

                <select
                    id="main-select"
                    disabled
                >
                    <option value="">
                        [Select SWF Target]
                    </option>
                </select>

                <button
                    class="btn"
                    id="launch-btn"
                    disabled
                >
                    Launch
                </button>

            </div>

        </div>

    </div>


    <div id="blob-inspector"></div>

    <div id="player-container">

        <div>
            [VFS Waiting for Files]
        </div>

    </div>

</div>


<script>

const baseOrigin = "https://flash.nins.cc";
const virtualFS = {};

window.RufflePlayer = window.RufflePlayer || {};

window.RufflePlayer.config = {
    publicPath:"./static/js/",
    letterbox:"on",
    scale:"showAll",
    forceScale:true,
    quality:"high"
};


const container = document.getElementById("player-container");
const urlInput = document.getElementById("url-input");
const fetchBtn = document.getElementById("fetch-btn");
const filesInput = document.getElementById("files-input");
const mainSelect = document.getElementById("main-select");
const launchBtn = document.getElementById("launch-btn");
const cacheInfo = document.getElementById("cache-info");
const inspector = document.getElementById("blob-inspector");


function updateUI(){

    const count = Object.keys(virtualFS).length;

    cacheInfo.innerText = `[Mounted ${count} Files]`;

    mainSelect.disabled = count===0;
    launchBtn.disabled = count===0;

}


function addAssetToVFS(name, blob){

    const key = name.toLowerCase();
    const virtualURL = `${baseOrigin}/${key}`;

    if(virtualFS[key]){
        URL.revokeObjectURL(virtualFS[key].rawUrl);
    }

    virtualFS[key] = {
        blob:blob,
        displayUrl:virtualURL,
        rawUrl:URL.createObjectURL(blob) 
    };


    if(key.endsWith(".swf")){

        let option = [...mainSelect.options].find(o=>o.value===key);

        if(!option){
            option = document.createElement("option");
            option.value = key; 
            mainSelect.appendChild(option);
        }

        option.textContent = virtualURL;
    }

}


mainSelect.addEventListener(
"change",
()=>{

    const key = mainSelect.value;

    if(!key || !virtualFS[key]){
        inspector.style.display = "none";
        return;
    }

    const asset = virtualFS[key];

    inspector.style.display = "block";
    inspector.innerHTML=
`
<b>Virtual URL (Alias)</b>
<br><br>
${asset.displayUrl}
<br><br>
<b>Real Native Blob URL</b>
<br><br>
${asset.rawUrl}
`;

});


fetchBtn.addEventListener(
"click",
async()=>{

    const url = urlInput.value.trim();

    if(!url) return;

    try{

        cacheInfo.innerText = "[Fetching...]";

        const res = await fetch(url);

        if(!res.ok){
            throw new Error(
                `HTTP ${res.status}`
            );
        }

        const blob = await res.blob();

        const fileName =
            url
            .split("?")[0]
            .split("/")
            .pop();

        addAssetToVFS(
            fileName,
            blob
        );

        updateUI();
        urlInput.value = ""; 

    }
    catch(err){

        alert(`Fetch 失敗:\n${err.message}`);
        updateUI(); 

    }

});


filesInput.addEventListener(
"change",
e=>{

    [...e.target.files]
    .forEach(file=>{

        addAssetToVFS(
            file.name,
            file
        );

    });

    updateUI();
    e.target.value = ""; 

});


function initPlayer(){

    container.innerHTML="";

    const ruffle =
        window
        .RufflePlayer
        .newest();

    const player =
        ruffle.createPlayer();

    container.appendChild(
        player
    );

    // 🎯 【超強防禦型攔截器核心】
    player.onInterceptURLLoad =
    (url)=>{

        console.log("[Ruffle 原始請求網址]:", url);
        
        // 1. 優先處理像第二張截圖中那種純檔名（e.g., "top.swf" 或 "top.swf?雜質"）
        // 只要能從這串字串結尾切出乾淨的小寫檔名，且我們 VFS 裡有，就直接攔截！
        let cleanName = url.split('?')[0].split('/').pop().toLowerCase();
        
        if (virtualFS[cleanName]) {
            console.log(`%c[VFS 強制檔名命中] 成功攔截純檔名請求: ${cleanName} >>> ${virtualFS[cleanName].rawUrl}`, "color: #00bb00; font-weight: bold;");
            return virtualFS[cleanName].rawUrl;
        }

        // 2. 後備處理帶網域的標準網址 (e.g., https://... 或 blob:https://...)
        try {
            const parsed = new URL(url, baseOrigin);
            let fileNameFromURL = parsed.pathname.split("/").pop().toLowerCase();
            
            if(virtualFS[fileNameFromURL]){
                console.log(`%c[VFS 網址解析命中] ${fileNameFromURL} >>> ${virtualFS[fileNameFromURL].rawUrl}`, "color: #00bb00; font-weight: bold;");
                return virtualFS[fileNameFromURL].rawUrl;
            }
        } catch(e) {}

        // 3. 第三防禦線：如果 Ruffle 依然噴出帶 UUID 的虛擬路徑 (blob:https://flash.nins.cc/xxxx-xxxx)
        // 且我們上面的檔名對齊失敗了，這裡啟動萬用後備：自動綁定到上傳的子 SWF 上
        if (url.includes("flash.nins.cc")) {
            const subSWFKey = Object.keys(virtualFS).find(k => k !== mainSelect.value && k.endsWith('.swf'));
            if(subSWFKey) {
                console.log(`%c[VFS 動態 UUID 映射成功] 虛擬路徑導向記憶體中的子 SWF: ${subSWFKey}`, "color: #0088cc; font-weight: bold;");
                return virtualFS[subSWFKey].rawUrl;
            }
        }

        return url;
    };

    return player;

}


launchBtn.addEventListener(
"click",
()=>{

    const key = mainSelect.value;

    if(!virtualFS[key])
        return;

    const asset = virtualFS[key];
    const player = initPlayer();

    console.log(`%c[啟動測試] 投餵原始 Blob Stream`, "color: #ff9900; font-weight: bold;");

    player.load({
        url: asset.rawUrl, 
        allowScriptAccess: true
    });

});

</script>

</body>
</html>
