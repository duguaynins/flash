<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruffle Flash Player</title>
    
    <script src="/static/js/ruffle.js"></script>

    <style>
        /* 簡約白底黑線風格變數 */
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #000000;
            --accent-dim: #767676;
            --input-bg: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 簡約外框容器 */
        .player-card {
            width: 100%;
            max-width: 800px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 30px;
            box-sizing: border-box;
        }

        h2 {
            margin: 0 0 24px 0;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* 輸入與控制區域 */
        .control-section {
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-color);
            text-transform: uppercase;
        }

        input[type="text"] {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-family: inherit;
            padding: 8px 12px;
            flex-grow: 1;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        /* 隱藏原生檔案上傳標籤 */
        input[type="file"] {
            display: none;
        }

        /* 簡約黑線按鈕樣式 */
        .btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            font-family: inherit;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            white-space: nowrap;
            transition: background-color 0.15s, color 0.15s;
        }

        .btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        /* 簡約分隔線 */
        hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 24px 0;
        }

        /* 播放器容器 - 鎖定 4:3 比例防止畫面拉伸破圖 */
        #player-container {
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #fafafa;
            border: 1px solid var(--border-color);
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .placeholder-text {
            color: var(--accent-dim);
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        /* 確保 Ruffle 元件完美填滿黑線容器 */
        #player-container ruffle-player {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>FLASH PLAYER CONTROLLER</h2>

        <div class="control-section">
            <label for="url-input">Execute From Remote URL</label>
            <div class="input-group">
                <input type="text" id="url-input" placeholder="https://example.com/game.swf">
                <button class="btn" id="load-url-btn">Load URL</button>
            </div>
        </div>
        
        <hr>

        <div class="control-section">
            <label>Mount & Execute Local File</label>
            <div class="input-group">
                <label class="btn" style="display: inline-block; text-align: center;">
                    <input type="file" id="file-input" accept=".swf">
                    Choose .SWF File
                </label>
            </div>
        </div>

        <div id="player-container">
            <div class="placeholder-text">[ AWAITING SWF INPUT ]</div>
        </div>
    </div>

    <script>
        // 設定 Ruffle 模組路徑
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            publicPath: "/static/js/",
            letterbox: "on",         // 開啟黑邊留白，確保不因容器比例失衡而變形
            scale: "showAll",        // 完整縮放模式
            forceScale: true,
            quality: "high"          // 高渲染品質（減少文字向量圖形鋸齒）
        };

        const container = document.getElementById("player-container");

        // 核心修正：每次重新建立全新播放器，徹底釋放前一個遊戲的記憶體以防止畫面破圖或殘留
        function initNewPlayer() {
            container.innerHTML = "";
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            container.appendChild(player);
            return player;
        }

        // 處理程序 1：遠端網址載入
        document.getElementById("load-url-btn").addEventListener("click", () => {
            const url = document.getElementById("url-input").value.trim();
            if (url) {
                const player = initNewPlayer();
                player.load({ url: url });
                console.log("Loading SWF URL: " + url);
            } else {
                alert("Please enter a valid SWF URL.");
            }
        });

        // 處理程序 2：本地檔案選取
        document.getElementById("file-input").addEventListener("change", (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    const arrayBuffer = e.target.result;
                    const player = initNewPlayer();
                    player.load({
                        data: arrayBuffer,
                        allowScriptAccess: true
                    });
                    console.log("Loaded local SWF: " + file.name);
                };
                
                reader.readAsArrayBuffer(file);
            }
        });
    </script>

</body>
</html>
