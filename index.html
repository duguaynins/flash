<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruffle VFS Player</title>

<style>
body {
    font-family: Arial;
    padding: 30px;
}
.player-card {
    max-width: 900px;
    margin: auto;
    border: 1px solid #000;
    padding: 20px;
}
#player-container {
    margin-top: 20px;
    width: 100%;
    aspect-ratio: 4/3;
    border: 1px solid #000;
}
.btn {
    padding: 8px 12px;
    border: 1px solid #000;
    cursor: pointer;
}
</style>

<script src="./static/js/ruffle.js"></script>
</head>

<body>

<div class="player-card">
    <h2>Ruffle VFS Loader</h2>

    <input id="files-input" type="file" multiple accept=".swf" />
    <select id="main-select">
        <option value="">Select SWF</option>
    </select>
    <button class="btn" id="launch-btn">Launch</button>

    <div id="player-container"></div>
</div>

<script>
const vfs = new Map();
const BASE_URL = "https://flash.nins.cc/";

let player = null;

/* =========================
   1. VFS 檔案掛載
========================= */
document.getElementById("files-input").addEventListener("change", (e) => {
    [...e.target.files].forEach(file => {
        const key = file.name.toLowerCase();

        vfs.set(key, file);

        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = key;

        document.getElementById("main-select").appendChild(opt);
    });
});

/* =========================
   2. FETCH 攔截（核心）
========================= */
const originalFetch = window.fetch;

window.fetch = async (input, init) => {
    const url = typeof input === "string" ? input : input.url;

    const name = url.split('/').pop().split('?')[0].toLowerCase();

    // DEBUG
    console.log("[FETCH]", url);

    if (vfs.has(name)) {
        console.log("%c[VFS HIT]: " + name, "color: green; font-weight: bold;");

        const file = vfs.get(name);
        const buffer = await file.arrayBuffer();

        return new Response(buffer, {
            headers: {
                "Content-Type": "application/x-shockwave-flash"
            }
        });
    }

    return originalFetch(input, init);
};

/* =========================
   3. 啟動 Ruffle
========================= */
document.getElementById("launch-btn").addEventListener("click", () => {

    const key = document.getElementById("main-select").value;
    const container = document.getElementById("player-container");

    container.innerHTML = "";

    player = window.RufflePlayer.newest().createPlayer();
    container.appendChild(player);

    console.log("Player created");

    player.load({
        url: key,
        baseUrl: BASE_URL,
        allowScriptAccess: true
    });
});
</script>

</body>
</html>
