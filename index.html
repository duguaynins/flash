<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruffle VFS Player - Unified Mobile Style</title>
    
    <script src="./static/js/ruffle.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #000000;
            --accent-dim: #767676;
            --height-unit: 38px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 20px 15px; /* 縮減邊距以適應手機螢幕 */
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .player-card {
            width: 100%;
            max-width: 600px; /* 縮小最大寬度，使其在電腦上也能呈現如手機般的精緻單欄 */
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 20px; /* 適度微調內襯 */
            box-sizing: border-box;
        }

        h2 {
            margin: 0 0 20px 0;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 統一排版：不分裝置，一律採用單欄直式佈局 */
        .control-panel {
            display: grid;
            grid-template-columns: 1fr; 
            gap: 16px;
            margin-bottom: 20px;
        }

        .control-section {
            display: flex;
            flex-direction: column;
        }

        .control-section label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .input-group {
            display: flex;
            width: 100%;
            height: var(--height-unit);
            box-sizing: border-box;
        }

        input[type="text"], select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-right: none;
            color: var(--text-color);
            font-family: inherit;
            padding: 0 12px;
            flex-grow: 1;
            font-size: 13px;
            outline: none;
            height: 100%;
            box-sizing: border-box;
        }

        select {
            cursor: pointer;
            border-radius: 0;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="file"] { display: none; }

        .btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            font-family: inherit;
            padding: 0 16px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            box-sizing: border-box;
            transition: background-color 0.1s, color 0.1s;
        }

        .btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        .file-mount-btn { border-left: none; }

        .blob-display-area {
            margin-top: 10px;
            margin-bottom: 10px;
            font-size: 11px;
            font-family: monospace;
            background-color: #fafafa;
            border: 1px dashed var(--border-color);
            padding: 10px;
            word-break: break-all;
            display: none;
        }

        .cache-status {
            font-size: 11px;
            color: var(--accent-dim);
            margin-top: 6px;
            font-style: italic;
        }

        /* 播放器區域（鎖定 4:3 比例，並確保不溢出手機螢幕） */
        #player-container {
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .placeholder-text {
            color: var(--accent-dim);
            font-size: 11px;
            letter-spacing: 1px;
        }

        #player-container ruffle-player { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>Flash VFS Controller</h2>

        <div class="control-panel">
            
            <div class="control-section">
                <label>Step 1: Mount Sources (URL or Files)</label>
                <div class="input-group">
                    <input type="text" id="url-cache-input" placeholder="https://example.com/game.swf">
                    <button class="btn" id="fetch-url-btn">Fetch</button>
                    <label class="btn file-mount-btn">
                        <input type="file" id="assets-input" accept=".swf,.mp3,.xml" multiple>
                        Files
                    </label>
                </div>
                <div class="cache-status" id="cache-info">[ VFS Drive Unmounted ]</div>
            </div>
            
            <div class="control-section">
                <label for="main-select">Step 2: Launch Selected BLOB</label>
                <div class="input-group">
                    <select id="main-select" disabled>
                        <option value="">[ Select Target SWF ]</option>
                    </select>
                    <button class="btn" id="launch-btn" disabled>Launch</button>
                </div>
            </div>

        </div>

        <div class="blob-display-area" id="blob-inspector"></div>

        <div id="player-container">
            <div class="placeholder-text">[ AWAITING VFS DRIVE MOUNT ]</div>
        </div>
    </div>

    <script>
        const virtualFS = {}; 
        const baseOrigin = window.location.origin;

        window.RufflePlayer = window.RufflePlayer || {};
        
        window.RufflePlayer.config = {
            publicPath: "./static/js/",
            letterbox: "on",         
            scale: "showAll",        
            forceScale: true,
            quality: "high"          
        };

        const container = document.getElementById("player-container");
        const urlCacheInput = document.getElementById("url-cache-input");
        const fetchUrlBtn = document.getElementById("fetch-url-btn");
        const assetsInput = document.getElementById("assets-input");
        const mainSelect = document.getElementById("main-select");
        const launchBtn = document.getElementById("launch-btn");
        const cacheInfo = document.getElementById("cache-info");
        const blobInspector = document.getElementById("blob-inspector");

        function updateUIStatus() {
            const totalCached = Object.keys(virtualFS).length;
            if (totalCached > 0) {
                cacheInfo.innerText = `[ Successfully Mounted ${totalCached} Files ]`;
                mainSelect.disabled = false;
                launchBtn.disabled = false;
            }
        }

        function addAssetToVFS(name, blobURL) {
            const lowerName = name.toLowerCase();
            
            if (virtualFS[lowerName]) {
                URL.revokeObjectURL(virtualFS[lowerName].rawUrl);
            }

            const targetBlobVirtualPath = `blob:${baseOrigin}/${lowerName}`;

            virtualFS[lowerName] = {
                rawUrl: blobURL,                 
                displayUrl: targetBlobVirtualPath 
            };

            if (lowerName.endsWith('.swf')) {
                const exists = Array.from(mainSelect.options).some(opt => opt.value === lowerName);
                if (!exists) {
                    const option = document.createElement("option");
                    option.value = lowerName;
                    option.textContent = targetBlobVirtualPath; 
                    mainSelect.appendChild(option);
                }
            }
        }

        mainSelect.addEventListener("change", () => {
            const key = mainSelect.value;
            if (key && virtualFS[key]) {
                blobInspector.style.style.display = "block";
                blobInspector.innerHTML = `<strong>TARGET BLOB PATH:</strong><br>${virtualFS[key].displayUrl}`;
            } else {
                blobInspector.style.display = "none";
            }
        });

        fetchUrlBtn.addEventListener("click", async () => {
            const url = urlCacheInput.value.trim();
            if (!url) return alert("Please enter a URL.");

            const fileName = url.split('/').pop() || "remote_game.swf";
            cacheInfo.innerText = "[ Fetching remote binary... ]";

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const blob = await response.blob();
                addAssetToVFS(fileName, URL.createObjectURL(blob));
                updateUIStatus();
                urlCacheInput.value = "";
            } catch (error) {
                alert(`Fetch failed (CORS or network error):\n${error.message}`);
                cacheInfo.innerText = "[ Fetch Failed ]";
            }
        });

        assetsInput.addEventListener("change", (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            files.forEach(file => {
                addAssetToVFS(file.name, URL.createObjectURL(file));
            });
            updateUIStatus();
        });

        function initNewPlayer() {
            container.innerHTML = "";
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            container.appendChild(player);

            player.onInterceptURLLoad = (url) => {
                const fileName = url.split('/').pop().toLowerCase();
                if (virtualFS[fileName]) {
                    console.log(`[VFS Forwarding] Redirected ${fileName} to memory source.`);
                    return virtualFS[fileName].rawUrl; 
                }
                return url;
            };

            return player;
        }

        launchBtn.addEventListener("click", () => {
            const selectedKey = mainSelect.value;
            if (!selectedKey) return alert("Please select a target BLOB.");

            const targetAsset = virtualFS[selectedKey];
            if (targetAsset) {
                const player = initNewPlayer();
                console.log(`Ruffle Loading Target: ${targetAsset.displayUrl}`);
                player.load({ url: targetAsset.rawUrl }); 
            }
        });
    </script>
</body>
</html>
