<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruffle VFS Player - Direct Mapping Pro</title>
    
    <script src="./static/js/ruffle.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #000000;
            --accent-dim: #767676;
            --height-unit: 38px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .player-card {
            width: 100%;
            max-width: 600px; /* 手機優先，直式單欄精緻比例 */
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 20px;
            box-sizing: border-box;
        }

        h2 {
            margin: 0 0 20px 0;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr; 
            gap: 16px;
            margin-bottom: 20px;
        }

        .control-section {
            display: flex;
            flex-direction: column;
        }

        .control-section label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .input-group {
            display: flex;
            width: 100%;
            height: var(--height-unit);
            box-sizing: border-box;
        }

        input[type="text"], select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-right: none;
            color: var(--text-color);
            font-family: inherit;
            padding: 0 12px;
            flex-grow: 1;
            font-size: 13px;
            outline: none;
            height: 100%;
            box-sizing: border-box;
        }

        select {
            cursor: pointer;
            border-radius: 0;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="file"] { display: none; }

        .btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            font-family: inherit;
            padding: 0 16px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            box-sizing: border-box;
            transition: background-color 0.1s, color 0.1s;
        }

        .btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        .file-mount-btn { border-left: none; }

        .blob-display-area {
            margin-top: 10px;
            margin-bottom: 10px;
            font-size: 11px;
            font-family: monospace;
            background-color: #fafafa;
            border: 1px dashed var(--border-color);
            padding: 10px;
            word-break: break-all;
            display: none;
        }

        .cache-status {
            font-size: 11px;
            color: var(--accent-dim);
            margin-top: 6px;
            font-style: italic;
        }

        #player-container {
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .placeholder-text {
            color: var(--accent-dim);
            font-size: 11px;
            letter-spacing: 1px;
        }

        #player-container ruffle-player { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>Flash VFS Controller</h2>

        <div class="control-panel">
            
            <div class="control-section">
                <label>Step 1: Mount Sources (URL or Files)</label>
                <div class="input-group">
                    <input type="text" id="url-cache-input" placeholder="https://example.com/game.swf">
                    <button class="btn" id="fetch-url-btn">Fetch</button>
                    <label class="btn file-mount-btn">
                        <input type="file" id="assets-input" accept=".swf,.mp3,.xml" multiple>
                        Files
                    </label>
                </div>
                <div class="cache-status" id="cache-info">[ VFS Drive Unmounted ]</div>
            </div>
            
            <div class="control-section">
                <label for="main-select">Step 2: Launch Selected BLOB</label>
                <div class="input-group">
                    <select id="main-select" disabled>
                        <option value="">[ Select Target SWF ]</option>
                    </select>
                    <button class="btn" id="launch-btn" disabled>Launch</button>
                </div>
            </div>

        </div>

        <div class="blob-display-area" id="blob-inspector"></div>

        <div id="player-container">
            <div class="placeholder-text">[ AWAITING VFS DRIVE MOUNT ]</div>
        </div>
    </div>

    <script>
        // 全域虛擬檔案系統對照表 (一律用純小寫檔名當 Key 檢索)
        const virtualFS = {}; 
        const baseOrigin = window.location.origin; // 自動取得目前網域，例如 https://flash.nins.cc

        // Ruffle 播放器全域基本配置
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            publicPath: "./static/js/",
            letterbox: "on",         
            scale: "showAll",        
            forceScale: true,
            quality: "high"          
        };

        const container = document.getElementById("player-container");
        const urlCacheInput = document.getElementById("url-cache-input");
        const fetchUrlBtn = document.getElementById("fetch-url-btn");
        const assetsInput = document.getElementById("assets-input");
        const mainSelect = document.getElementById("main-select");
        const launchBtn = document.getElementById("launch-btn");
        const cacheInfo = document.getElementById("cache-info");
        const blobInspector = document.getElementById("blob-inspector");

        // 更新介面狀態
        function updateUIStatus() {
            const totalCached = Object.keys(virtualFS).length;
            if (totalCached > 0) {
                cacheInfo.innerText = `[ Successfully Mounted ${totalCached} Files ]`;
                mainSelect.disabled = false;
                launchBtn.disabled = false;
            }
        }

        // 🎯 將上傳或拉取到的檔案二進位指標，塞入對照表並優化下拉選單
        function addAssetToVFS(name, rawBlobURL) {
            const lowerName = name.toLowerCase();
            
            // 釋放重複上傳時的舊記憶體指標，避免瀏覽器記憶體洩漏
            if (virtualFS[lowerName]) {
                URL.revokeObjectURL(virtualFS[lowerName].rawUrl);
            }

            // 完美的虛擬網址別名：blob:https://flash.nins.cc/main.swf
            const targetBlobVirtualPath = `blob:${baseOrigin}/${lowerName}`;

            // 資料庫儲存雙軌結構
            virtualFS[lowerName] = {
                rawUrl: rawBlobURL,                 // 真實底層解碼用的隨機 UUID Blob URL
                displayUrl: targetBlobVirtualPath // 你所要求的乾淨虛擬路徑顯示名稱
            };

            // 如果是主要 SWF 檔案，注入下拉選單
            if (lowerName.endsWith('.swf')) {
                // 檢查是否已存在選單中，存在就更新，不存在就新增
                let option = Array.from(mainSelect.options).find(opt => opt.getAttribute('data-key') === lowerName);
                
                if (!option) {
                    option = document.createElement("option");
                    mainSelect.appendChild(option);
                }

                // 🎯 完美應對結構映射：NAME 顯示與 VALUE 設定完全一體化轉為虛擬路徑
                option.setAttribute('data-key', lowerName); 
                option.textContent = targetBlobVirtualPath; // [NAME]  >>> blob:https://flash.nins.cc/main.swf
                option.value = targetBlobVirtualPath;       // [VALUE] >>> blob:https://flash.nins.cc/main.swf
            }
        }

        // 當下拉選單切換時，連動更新底層顯示面板
        mainSelect.addEventListener("change", () => {
            const selectedVirtualUrl = mainSelect.value;
            const found = Object.values(virtualFS).find(item => item.displayUrl === selectedVirtualUrl);
            
            if (selectedVirtualUrl && found) {
                blobInspector.style.display = "block";
                blobInspector.innerHTML = `<strong>VFS TARGET ALIAS:</strong><br>${found.displayUrl}<br><br><strong>INTERNAL MEMORY POINTER:</strong><br>${found.rawUrl}`;
            } else {
                blobInspector.style.display = "none";
            }
        });

        // 處理程序 A：遠端 URL 拉取
        fetchUrlBtn.addEventListener("click", async () => {
            const url = urlCacheInput.value.trim();
            if (!url) return alert("Please enter a URL.");

            const fileName = url.split('?')[0].split('/').pop() || "remote_game.swf";
            cacheInfo.innerText = "[ Fetching remote binary... ]";

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const blob = await response.blob();
                addAssetToVFS(fileName, URL.createObjectURL(blob));
                updateUIStatus();
                urlCacheInput.value = "";
            } catch (error) {
                alert(`Fetch failed:\n${error.message}`);
                cacheInfo.innerText = "[ Fetch Failed ]";
            }
        });

        // 處理程序 B：本地多檔案批次選取上傳 (SWF, XML, MP3 等相依檔案一次選取)
        assetsInput.addEventListener("change", (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            files.forEach(file => {
                addAssetToVFS(file.name, URL.createObjectURL(file));
            });
            updateUIStatus();
        });

        // 初始化播放器，並封裝「絕對防禦型」網址攔截轉向器
        function initNewPlayer() {
            container.innerHTML = "";
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            container.appendChild(player);

            // 🌟 onInterceptURLLoad 終極防漏接轉換邏輯 🌟
            player.onInterceptURLLoad = (url) => {
                console.log(`[Ruffle 原始請求網址]: ${url}`);
                try {
                    // 1. 強制以當前網域為基底解析，徹底剝離 Flash 結尾常見的防快取參數 (如 top.swf?v=123)
                    const parsedUrl = new URL(url, window.location.origin);
                    
                    // 2. 拿到純淨的路徑部分後，切出最後的純小寫檔名 (例如: "top.swf")
                    let fileName = parsedUrl.pathname.split('/').pop().toLowerCase();

                    // 3. 額外容錯防禦：若 ActionScript 內部拼接出帶有雙重 blob: 的異常請求，強行進行二次修正
                    if (url.startsWith('blob:')) {
                        const cleanUrl = url.replace(/^blob:/, '');
                        try {
                            const secUrl = new URL(cleanUrl);
                            fileName = secUrl.pathname.split('/').pop().toLowerCase();
                        } catch(err) {}
                    }

                    // 4. 精準比對快取對照表
                    if (virtualFS[fileName]) {
                        // 🎯 核心轉向：直接攔截並強行引導至你指定的虛擬 BLOB 路徑
                        const finalVirtualBlob = virtualFS[fileName].displayUrl;
                        console.log(`[VFS 攔截成功] ${url} >>> 轉向至 >>> ${finalVirtualBlob}`);
                        return finalVirtualBlob; 
                    }
                } catch(e) {
                    // 備用暴力降級切法，防止特殊字符造成 URL 物件解析崩潰
                    const fileName = url.split('?')[0].split('/').pop().toLowerCase();
                    if (virtualFS[fileName]) return virtualFS[fileName].displayUrl;
                }
                
                console.warn(`[VFS 漏空放行] 檔案未預載，走實體網路請求: ${url}`);
                return url;
            };

            return player;
        }

        // 點擊 Launch 按鈕執行主要 SWF 
        launchBtn.addEventListener("click", () => {
            const selectedVirtualUrl = mainSelect.value; // 此時拿到的就是 "blob:https://flash.nins.cc/main.swf"
            
            if (!selectedVirtualUrl) return alert("Please select a target BLOB.");

            // 透過下拉選單的值（虛擬路徑），反向追蹤出記憶體中真正的數據流結構
            const foundAsset = Object.values(virtualFS).find(item => item.displayUrl === selectedVirtualUrl);
            
            if (foundAsset) {
                const player = initNewPlayer();
                console.log(`Ruffle Loading Main SWF Alias: ${selectedVirtualUrl}`);
                
                // 💡 為了防範開頭讀取引發 ERR_FILE_NOT_FOUND，投餵給 player.load 的仍必須是真實二進位隨機 UUID Blob 網址
                player.load({ url: foundAsset.rawUrl }); 
            }
        });
    </script>
</body>
</html>
