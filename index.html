<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruffle VFS Player - Absolute Pure VFS</title>
    
    <script src="./static/js/ruffle.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #000000;
            --accent-dim: #767676;
            --height-unit: 38px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .player-card {
            width: 100%;
            max-width: 600px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 20px;
            box-sizing: border-box;
        }

        h2 {
            margin: 0 0 20px 0;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr; 
            gap: 16px;
            margin-bottom: 20px;
        }

        .control-section {
            display: flex;
            flex-direction: column;
        }

        .control-section label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .input-group {
            display: flex;
            width: 100%;
            height: var(--height-unit);
            box-sizing: border-box;
        }

        input[type="text"], select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-right: none;
            color: var(--text-color);
            font-family: inherit;
            padding: 0 12px;
            flex-grow: 1;
            font-size: 13px;
            outline: none;
            height: 100%;
            box-sizing: border-box;
        }

        select {
            cursor: pointer;
            border-radius: 0;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="file"] { display: none; }

        .btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            font-family: inherit;
            padding: 0 16px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            box-sizing: border-box;
            transition: background-color 0.1s, color 0.1s;
        }

        .btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        .file-mount-btn { border-left: none; }

        .blob-display-area {
            margin-top: 10px;
            margin-bottom: 10px;
            font-size: 11px;
            font-family: monospace;
            background-color: #fafafa;
            border: 1px dashed var(--border-color);
            padding: 10px;
            word-break: break-all;
            display: none;
        }

        .cache-status {
            font-size: 11px;
            color: var(--accent-dim);
            margin-top: 6px;
            font-style: italic;
        }

        #player-container {
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .placeholder-text {
            color: var(--accent-dim);
            font-size: 11px;
            letter-spacing: 1px;
        }

        #player-container ruffle-player { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>Flash VFS Controller</h2>

        <div class="control-panel">
            <div class="control-section">
                <label>Step 1: Mount Sources (URL or Files)</label>
                <div class="input-group">
                    <input type="text" id="url-cache-input" placeholder="https://example.com/game.swf">
                    <button class="btn" id="fetch-url-btn">Fetch</button>
                    <label class="btn file-mount-btn">
                        <input type="file" id="assets-input" accept=".swf,.mp3,.xml" multiple>
                        Files
                    </label>
                </div>
                <div class="cache-status" id="cache-info">[ VFS Drive Unmounted ]</div>
            </div>
            
            <div class="control-section">
                <label for="main-select">Step 2: Launch Selected BLOB</label>
                <div class="input-group">
                    <select id="main-select" disabled>
                        <option value="">[ Select Target SWF ]</option>
                    </select>
                    <button class="btn" id="launch-btn" disabled>Launch</button>
                </div>
            </div>
        </div>

        <div class="blob-display-area" id="blob-inspector"></div>

        <div id="player-container">
            <div class="placeholder-text">[ AWAITING VFS DRIVE MOUNT ]</div>
        </div>
    </div>

    <script>
        // 全域虛擬檔案系統對照表 (一律用純小寫檔名當 Key 檢索)
        const virtualFS = {}; 
        const baseOrigin = window.location.origin; // 例如 https://flash.nins.cc

        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            publicPath: "./static/js/",
            letterbox: "on",         
            scale: "showAll",        
            forceScale: true,
            quality: "high"          
        };

        const container = document.getElementById("player-container");
        const urlCacheInput = document.getElementById("url-cache-input");
        const fetchUrlBtn = document.getElementById("fetch-url-btn");
        const assetsInput = document.getElementById("assets-input");
        const mainSelect = document.getElementById("main-select");
        const launchBtn = document.getElementById("launch-btn");
        const cacheInfo = document.getElementById("cache-info");
        const blobInspector = document.getElementById("blob-inspector");

        function updateUIStatus() {
            const totalCached = Object.keys(virtualFS).length;
            if (totalCached > 0) {
                cacheInfo.innerText = `[ Successfully Mounted ${totalCached} Files ]`;
                mainSelect.disabled = false;
                launchBtn.disabled = false;
            }
        }

        // 核心：將檔案轉成 Blob 儲存，並對應下拉選單
        function addAssetToVFS(name, blobObject) {
            const lowerName = name.toLowerCase();
            
            // 完美的虛擬網址別名：blob:https://flash.nins.cc/main.swf
            const targetBlobVirtualPath = `blob:${baseOrigin}/${lowerName}`;

            // 🌟 這次除了存真實的隨機 UUID 網址（給相依子檔案用），也把原本的 Blob 實體留下來（啟動主程式用）
            virtualFS[lowerName] = {
                blob: blobObject,
                rawUrl: URL.createObjectURL(blobObject),
                displayUrl: targetBlobVirtualPath
            };

            if (lowerName.endsWith('.swf')) {
                let option = Array.from(mainSelect.options).find(opt => opt.getAttribute('data-key') === lowerName);
                if (!option) {
                    option = document.createElement("option");
                    mainSelect.appendChild(option);
                }

                option.setAttribute('data-key', lowerName); 
                option.textContent = targetBlobVirtualPath; // [NAME]  >>> blob:https://flash.nins.cc/main.swf
                option.value = targetBlobVirtualPath;       // [VALUE] >>> blob:https://flash.nins.cc/main.swf
            }
        }

        mainSelect.addEventListener("change", () => {
            const selectedVirtualUrl = mainSelect.value;
            const found = Object.values(virtualFS).find(item => item.displayUrl === selectedVirtualUrl);
            if (selectedVirtualUrl && found) {
                blobInspector.style.display = "block";
                blobInspector.innerHTML = `<strong>VFS TARGET ALIAS:</strong><br>${found.displayUrl}`;
            } else {
                blobInspector.style.display = "none";
            }
        });

        // 遠端 URL 拉取
        fetchUrlBtn.addEventListener("click", async () => {
            const url = urlCacheInput.value.trim();
            if (!url) return alert("Please enter a URL.");

            const fileName = url.split('?')[0].split('/').pop() || "remote_game.swf";
            cacheInfo.innerText = "[ Fetching remote binary... ]";

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const blob = await response.blob();
                addAssetToVFS(fileName, blob);
                updateUIStatus();
                urlCacheInput.value = "";
            } catch (error) {
                alert(`Fetch failed:\n${error.message}`);
                cacheInfo.innerText = "[ Fetch Failed ]";
            }
        });

        // 本地多檔案批次選取上傳 (SWF, XML, MP3 一起選)
        assetsInput.addEventListener("change", (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            files.forEach(file => {
                addAssetToVFS(file.name, file);
            });
            updateUIStatus();
        });

        // 初始化播放器並註冊攔截器
        function initNewPlayer() {
            container.innerHTML = "";
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            container.appendChild(player);

            // 🌟 100% 絕對防禦的攔截轉向 🌟
            player.onInterceptURLLoad = (url) => {
                console.log(`[Ruffle 內部發起請求]: ${url}`);
                try {
                    // 解析並剝離參數，切出純淨小寫檔名
                    const parsedUrl = new URL(url, window.location.origin);
                    let fileName = parsedUrl.pathname.split('/').pop().toLowerCase();

                    // 容錯防禦：如果 Ruffle 拿著拼接出來的虛擬路徑來查
                    if (url.startsWith('blob:')) {
                        const cleanUrl = url.replace(/^blob:/, '');
                        try {
                            const secUrl = new URL(cleanUrl);
                            fileName = secUrl.pathname.split('/').pop().toLowerCase();
                        } catch(err) {}
                    }

                    // 🎯 精準命中：當子檔案請求發起時，丟回真實瀏覽器認得的隨機 UUID Blob
                    if (virtualFS[fileName]) {
                        console.log(`%c[VFS 攔截命中!!] 成功將子請求 ${fileName} 導向至本地二進位指標`, "color: #00bb00");
                        return virtualFS[fileName].rawUrl; 
                    }
                } catch(e) {
                    const fileName = url.split('?')[0].split('/').pop().toLowerCase();
                    if (virtualFS[fileName]) return virtualFS[fileName].rawUrl;
                }
                
                console.warn(`[VFS 漏空] 放行實體請求: ${url}`);
                return url;
            };

            return player;
        }

        // 點擊 Launch 按鈕啟動主要 SWF 
        launchBtn.addEventListener("click", () => {
            const selectedVirtualUrl = mainSelect.value; // 拿到 "blob:https://flash.nins.cc/main.swf"
            if (!selectedVirtualUrl) return alert("Please select a target BLOB.");

            const foundAsset = Object.values(virtualFS).find(item => item.displayUrl === selectedVirtualUrl);
            
            if (foundAsset) {
                const player = initNewPlayer();
                
                // 🌟 【核心修正】：不投餵任何實體網址字串！改用 FileReader 直接轉 ArrayBuffer 投餵二進位
                const reader = new FileReader();
                reader.onload = (e) => {
                    const arrayBuffer = e.target.result;
                    
                    console.log(`%c[VFS Booting] 正在用純二進位啟動主程式，並將基底網址綁定為: ${selectedVirtualUrl}`, "color: #0088cc; font-weight: bold;");
                    
                    // 🎯 強制將 Ruffle 的渲染內核基底鎖死在你指定的虛擬網址上！
                    player.load({
                        data: arrayBuffer,
                        url: selectedVirtualUrl, // 完美基底：blob:https://flash.nins.cc/main.swf
                        allowScriptAccess: true
                    });
                };
                
                reader.readAsArrayBuffer(foundAsset.blob);
            }
        });
    </script>
</body>
</html>
