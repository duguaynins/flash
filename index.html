<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Ruffle VFS Player - Standardized Mapping</title>
    <script src="./static/js/ruffle.js"></script>
    <style>
        body { font-family: sans-serif; padding: 40px; display: flex; justify-content: center; }
        .card { width: 100%; max-width: 900px; border: 1px solid #000; padding: 20px; }
        .panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .btn { border: 1px solid #000; background: white; padding: 10px; cursor: pointer; }
        #player { margin-top: 20px; width: 100%; aspect-ratio: 4/3; border: 1px solid #000; }
    </style>
</head>
<body>

<div class="card">
    <h2>VFS Controller (Standardized)</h2>
    <div class="panel">
        <div>
            <label>1. Upload Assets</label><br>
            <input type="file" id="file-input" multiple>
        </div>
        <div>
            <label>2. Launch</label><br>
            <select id="main-select"></select>
            <button class="btn" id="launch-btn">Launch</button>
        </div>
    </div>
    <div id="player"></div>
</div>

<script>
const virtualFS = {};
const BASE_URL = "https://flash.nins.cc/";

// 1. 檔案載入與註冊
document.getElementById('file-input').addEventListener('change', (e) => {
    [...e.target.files].forEach(file => {
        const key = file.name.toLowerCase();
        virtualFS[key] = URL.createObjectURL(file);
        
        if(key.endsWith('.swf')) {
            let opt = document.createElement('option');
            opt.value = key;
            opt.textContent = key;
            document.getElementById('main-select').appendChild(opt);
        }
    });
});

// 2. 核心邏輯實現
document.getElementById('launch-btn').addEventListener('click', () => {
    const key = document.getElementById('main-select').value;
    const container = document.getElementById('player');
    container.innerHTML = "";
    
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    container.appendChild(player);

    // 攔截器架構：Normalize -> Lookup -> Map
    player.onInterceptURLLoad = (url) => {
        // [Normalize] 標準化處理
        const normalized = new URL(url, BASE_URL).href;
        // [Lookup] 比對檔名
        const fileName = normalized.split('/').pop().split('?')[0].toLowerCase();
        
        // [Map] 映射回傳
        if (virtualFS[fileName]) {
            console.log(`[VFS Mapping] ${fileName} -> Hit`);
            return virtualFS[fileName];
        }
        return url;
    };

    // 強制設定 baseUrl 以啟用相對路徑轉換
    player.load({
        url: virtualFS[key],
        baseUrl: BASE_URL,
        allowScriptAccess: true
    });
});
</script>
</body>
</html>
