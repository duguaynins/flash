<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruffle VFS Player</title>


    <style>
:root{
    --bg:#fff;
    --text:#000;
    --border:#000;
    --dim:#777;
    --height:38px;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px 15px;

    background:var(--bg);
    color:var(--text);

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

    display:flex;
    justify-content:center;
}

.player-card{

    width:100%;
    max-width:600px;

    border:1px solid var(--border);

    padding:20px;
}


h2{

    margin:0 0 20px;

    font-size:14px;
    font-weight:700;

    letter-spacing:1px;
    text-transform:uppercase;
}

.control-panel{

    display:grid;
    gap:16px;

    margin-bottom:20px;
}

.control-section{

    display:flex;
    flex-direction:column;
}

.control-section label{

    font-size:11px;
    font-weight:600;

    letter-spacing:.5px;

    text-transform:uppercase;

    margin-bottom:6px;
}

.input-group{

    display:grid;

    grid-template-columns:1fr auto;

    gap:8px;
}

input[type=file]{
    display:none;
}

select{

    height:var(--height);

    border:1px solid var(--border);

    padding:0 12px;

    background:#fff;

    font-size:13px;

    outline:none;

    width:100%;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;

    appearance:none;
}


.btn{

    height:var(--height);

    border:1px solid var(--border);

    background:#fff;

    padding:0 16px;

    font-size:11px;
    font-weight:600;

    text-transform:uppercase;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    white-space:nowrap;

    transition:.15s;
}

.btn:hover{

    background:#000;
    color:#fff;
}


.file-btn{

    grid-column:1/-1;
}


#player-container{

    width:100%;

    aspect-ratio:4/3;

    border:1px solid var(--border);

    overflow:hidden;

    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;
}


.placeholder-text{

    font-size:11px;
    color:var(--dim);

    letter-spacing:1px;
}


#player-container ruffle-player,
#player-container canvas{

    width:100%!important;
    height:100%!important;
    display:block;
}
    </style>

<script src="./static/js/ruffle.js"></script>
</head>
<body>

<div class="player-card">

    <h2>Flash.sys - Flash VFS Controller</h2>

    <div class="control-panel">

        <div class="control-section">

            <label>Mount SWF Files</label>

            <div class="input-group">

                <label class="btn file-btn">
                    <input
                        id="files-input"
                        type="file"
                        multiple
                        accept=".swf"
                    >
                    Select Files
                </label>

            </div>

        </div>


        <div class="control-section">

            <label>Launch Selected SWF</label>

            <div class="input-group">

                <select id="main-select">

                    <option value="">
                        [ Select SWF ]
                    </option>

                </select>

                <button
                    class="btn"
                    id="launch-btn"
                >
                    Launch
                </button>

            </div>

        </div>

    </div>

    <div id="player-container">

        <div class="placeholder-text">
            [ WAITING FOR FILES ]
        </div>

    </div>

</div>


<script>
const vfs = new Map();
const BASE_URL = "https://flash.nins.cc/";

let player = null;

/* =========================
   1. VFS 檔案掛載
========================= */
document.getElementById("files-input").addEventListener("change", (e) => {
    [...e.target.files].forEach(file => {
        const key = file.name.toLowerCase();

        vfs.set(key, file);

        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = key;

        document.getElementById("main-select").appendChild(opt);
    });
});

/* =========================
   2. FETCH 攔截（核心）
========================= */
const originalFetch = window.fetch;

window.fetch = async (input, init) => {

    let url = "";

    // ✅ 安全處理各種 input 型態
    if (typeof input === "string") {
        url = input;
    } 
    else if (input && typeof input.url === "string") {
        url = input.url;
    } 
    else {
        console.log("[FETCH skipped - unknown input]", input);
        return originalFetch(input, init);
    }

    console.log("[FETCH]", url);

    const name = url.split('/').pop()?.split('?')[0]?.toLowerCase();

    if (!name) {
        return originalFetch(input, init);
    }

    if (vfs.has(name)) {
        console.log("%c[VFS HIT]: " + name, "color: green; font-weight: bold;");

        const file = vfs.get(name);
        const buffer = await file.arrayBuffer();

        return new Response(buffer, {
            headers: {
                "Content-Type": "application/x-shockwave-flash"
            }
        });
    }

    return originalFetch(input, init);
};

/* =========================
   3. 啟動 Ruffle
========================= */
document.getElementById("launch-btn").addEventListener("click", () => {

    const key = document.getElementById("main-select").value;
    const container = document.getElementById("player-container");

    container.innerHTML = "";

    player = window.RufflePlayer.newest().createPlayer();
    player.style.width = "100%";
    player.style.height = "100%";
    player.style.display = "block";
    container.appendChild(player);

    console.log("Player created");

    player.load({
        url: key,
        baseUrl: BASE_URL,
        allowScriptAccess: true,
        scale: "exactFit" // 改為讓它完美填滿計算出來的高度 >>>  exactFit <<< showAll
    });
});
</script>

</body>
</html>
