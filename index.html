<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruffle VFS Professional Loader</title>

<script src="./static/js/ruffle.js"></script>

<style>
body{
    margin:0;
    padding:40px;
    font-family:Arial, sans-serif;
    background:#fff;
    display:flex;
    justify-content:center;
}

.card{
    width:100%;
    max-width:900px;
    border:1px solid #000;
    padding:20px;
    box-sizing:border-box;
}

.row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

input, select{
    flex:1;
    height:38px;
    border:1px solid #000;
    padding:0 10px;
    box-sizing:border-box;
}

button{
    height:38px;
    border:1px solid #000;
    background:#fff;
    cursor:pointer;
    padding:0 15px;
}

button:hover{
    background:#000;
    color:#fff;
}

#player{
    margin-top:20px;
    width:100%;
    aspect-ratio:4/3;
    border:1px solid #000;
}

#log{
    margin-top:10px;
    font-size:12px;
    font-family:monospace;
    white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="card">

    <div class="row">
        <input id="urlInput" placeholder="https://example.com/main.swf">
        <button id="loadBtn">Load SWF</button>
    </div>

    <div class="row">
        <input type="file" id="fileInput" multiple accept=".swf,.mp3,.xml">
        <select id="swfList"></select>
        <button id="runBtn">Run</button>
    </div>

    <div id="player"></div>

    <div id="log"></div>

</div>

<script>

const baseOrigin = "https://flash.nins.cc";

/**
 * VFS:
 * key = normalized path
 * value = blob URL
 */
const VFS = new Map();

/* -------------------------
   Path Normalize（核心）
--------------------------*/
function normalize(url){
    try{
        const u = new URL(url, baseOrigin);
        return u.pathname.replace(/^\/+/,'').toLowerCase();
    }catch(e){
        return url.split('?')[0]
                  .split('/')
                  .pop()
                  .toLowerCase();
    }
}

/* -------------------------
   Mount file into VFS
--------------------------*/
function mountFile(name, blob){

    const key = name.replace(/^\/+/,'').toLowerCase();

    const blobURL = URL.createObjectURL(blob);

    VFS.set(key, blobURL);

    log(`[VFS] mount ${key}`);
}

/* -------------------------
   Ruffle init
--------------------------*/
function createPlayer(){

    const container = document.getElementById("player");
    container.innerHTML = "";

    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();

    container.appendChild(player);

    player.onInterceptURLLoad = (url)=>{

        const key = normalize(url);

        if(VFS.has(key)){
            const blob = VFS.get(key);
            log(`[HIT] ${key}`);
            return blob;
        }

        return url;
    };

    return player;
}

/* -------------------------
   UI log
--------------------------*/
function log(msg){
    document.getElementById("log").textContent += msg + "\n";
}

/* -------------------------
   Load SWF
--------------------------*/
let currentPlayer = null;

document.getElementById("loadBtn").onclick = async ()=>{

    const url = document.getElementById("urlInput").value.trim();
    if(!url) return;

    const res = await fetch(url);
    const blob = await res.blob();
    const buf = await blob.arrayBuffer();

    const key = normalize(url);

    mountFile(key, blob);

    currentPlayer = createPlayer();

    currentPlayer.load({
        data: buf,
        url: `${baseOrigin}/${key}`,
        allowScriptAccess:true
    });

};

/* -------------------------
   Upload files
--------------------------*/
document.getElementById("fileInput").onchange = (e)=>{

    [...e.target.files].forEach(f=>{
        mountFile(f.name, f);

        const opt = document.createElement("option");
        opt.value = f.name.toLowerCase();
        opt.textContent = f.name;
        document.getElementById("swfList").appendChild(opt);
    });

};

/* -------------------------
   Run selected SWF
--------------------------*/
document.getElementById("runBtn").onclick = ()=>{

    const key = document.getElementById("swfList").value;
    if(!key) return;

    const blobURL = VFS.get(key);
    if(!blobURL) return;

    currentPlayer = createPlayer();

    currentPlayer.load({
        url: `${baseOrigin}/${key}`,
        allowScriptAccess:true
    });

};

</script>

</body>
</html></script>
</body>
</html>
