<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruffle VFS Player - Standard Path Pro</title>
    
    <script src="./static/js/ruffle.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #000000;
            --accent-dim: #767676;
            --height-unit: 38px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .player-card {
            width: 100%;
            max-width: 800px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 30px;
            box-sizing: border-box;
        }

        h2 {
            margin: 0 0 24px 0;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 768px) {
            .control-panel { grid-template-columns: 1fr; gap: 16px; }
        }

        .control-section {
            display: flex;
            flex-direction: column;
        }

        .control-section label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .input-group {
            display: flex;
            width: 100%;
            height: var(--height-unit);
            box-sizing: border-box;
        }

        input[type="text"], select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-right: none;
            color: var(--text-color);
            font-family: inherit;
            padding: 0 12px;
            flex-grow: 1;
            font-size: 13px;
            outline: none;
            height: 100%;
            box-sizing: border-box;
        }

        select {
            cursor: pointer;
            border-radius: 0;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="file"] { display: none; }

        .btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            font-family: inherit;
            padding: 0 16px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            box-sizing: border-box;
            transition: background-color 0.1s, color 0.1s;
        }

        .btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        .file-mount-btn { border-left: none; }

        .blob-display-area {
            margin-top: 10px;
            font-size: 11px;
            font-family: monospace;
            background-color: #fafafa;
            border: 1px dashed var(--border-color);
            padding: 10px;
            word-break: break-all;
            display: none;
        }

        .cache-status {
            font-size: 11px;
            color: var(--accent-dim);
            margin-top: 6px;
            font-style: italic;
        }

        #player-container {
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            margin-top: 20px;
        }

        .placeholder-text {
            color: var(--accent-dim);
            font-size: 11px;
            letter-spacing: 1px;
        }

        #player-container ruffle-player { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>Flash VFS Controller</h2>

        <div class="control-panel">
            <div class="control-section">
                <label>Step 1: Mount Sources (URL or Files)</label>
                <div class="input-group">
                    <input type="text" id="url-cache-input" placeholder="https://example.com/game.swf">
                    <button class="btn" id="fetch-url-btn">Fetch</button>
                    <label class="btn file-mount-btn">
                        <input type="file" id="assets-input" accept=".swf,.mp3,.xml" multiple>
                        Files
                    </label>
                </div>
                <div class="cache-status" id="cache-info">[ VFS Drive Unmounted ]</div>
            </div>
            
            <div class="control-section">
                <label for="main-select">Step 2: Launch Selected BLOB</label>
                <div class="input-group">
                    <select id="main-select" disabled>
                        <option value="">[ Select Target SWF ]</option>
                    </select>
                    <button class="btn" id="launch-btn" disabled>Launch</button>
                </div>
            </div>
        </div>

        <div class="blob-display-area" id="blob-inspector"></div>

        <div id="player-container">
            <div class="placeholder-text">[ AWAITING VFS DRIVE MOUNT ]</div>
        </div>
    </div>

    <script>
        const virtualFS = {}; 
        const baseOrigin = "https://flash.nins.cc"; // 鎖死你的虛擬指定網域

        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            publicPath: "./static/js/",
            letterbox: "on",         
            scale: "showAll",        
            forceScale: true,
            quality: "high"          
        };

        const container = document.getElementById("player-container");
        const urlCacheInput = document.getElementById("url-cache-input");
        const fetchUrlBtn = document.getElementById("fetch-url-btn");
        const assetsInput = document.getElementById("assets-input");
        const mainSelect = document.getElementById("main-select");
        const launchBtn = document.getElementById("launch-btn");
        const cacheInfo = document.getElementById("cache-info");
        const blobInspector = document.getElementById("blob-inspector");

        function updateUIStatus() {
            const totalCached = Object.keys(virtualFS).length;
            if (totalCached > 0) {
                cacheInfo.innerText = `[ Successfully Mounted ${totalCached} Files ]`;
                mainSelect.disabled = false;
                launchBtn.disabled = false;
            }
        }

        // 將檔案封裝進虛擬 VFS 核心
        function addAssetToVFS(name, blobObject) {
            const lowerName = name.toLowerCase();
            const targetBlobVirtualPath = `blob:${baseOrigin}/${lowerName}`;

            if (virtualFS[lowerName]) {
                URL.revokeObjectURL(virtualFS[lowerName].rawUrl);
            }

            // 同時保留 Blob 實體與生出真實的 UUID 網址
            virtualFS[lowerName] = {
                blob: blobObject,
                rawUrl: URL.createObjectURL(blobObject),
                displayUrl: targetBlobVirtualPath
            };

            if (lowerName.endsWith('.swf')) {
                let option = Array.from(mainSelect.options).find(opt => opt.value === lowerName);
                if (!option) {
                    option = document.createElement("option");
                    option.value = lowerName; // VALUE 保持乾淨的 Key（純檔名）
                    mainSelect.appendChild(option);
                }
                option.textContent = targetBlobVirtualPath; // NAME 完美顯示虛擬網址
            }
        }

        mainSelect.addEventListener("change", () => {
            const key = mainSelect.value;
            if (key && virtualFS[key]) {
                blobInspector.style.display = "block";
                blobInspector.innerHTML = `<strong>TARGET BLOB PATH:</strong><br>${virtualFS[key].displayUrl}`;
            } else {
                blobInspector.style.display = "none";
            }
        });

        fetchUrlBtn.addEventListener("click", async () => {
            const url = urlCacheInput.value.trim();
            if (!url) return alert("Please enter a URL.");

            const fileName = url.split('?')[0].split('/').pop() || "remote_game.swf";
            cacheInfo.innerText = "[ Fetching remote binary... ]";

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const blob = await response.blob();
                addAssetToVFS(fileName, blob);
                updateUIStatus();
                urlCacheInput.value = "";
            } catch (error) {
                alert(`Fetch failed:\n${error.message}`);
                cacheInfo.innerText = "[ Fetch Failed ]";
            }
        });

        assetsInput.addEventListener("change", (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            files.forEach(file => {
                addAssetToVFS(file.name, file);
            });
            updateUIStatus();
        });

        // 初始化播放器並附加「精準導航攔截器」
        function initNewPlayer() {
            container.innerHTML = "";
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            container.appendChild(player);

            // 🎯 核心攔截轉向
            player.onInterceptURLLoad = (url) => {
                console.log(`[Ruffle 內部發起請求]: ${url}`);
                try {
                    // 1. 去除防快取雜質，取得純淨小寫檔名
                    const parsedUrl = new URL(url, baseOrigin);
                    let fileName = parsedUrl.pathname.split('/').pop().toLowerCase();

                    if (url.startsWith('blob:')) {
                        const cleanUrl = url.replace(/^blob:/, '');
                        try {
                            const secUrl = new URL(cleanUrl);
                            fileName = secUrl.pathname.split('/').pop().toLowerCase();
                        } catch(err) {}
                    }

                    // 2. 🎯 只要命中 VFS 對照表，立刻把底層真實可讀取的 UUID 網址丟回給 Ruffle 核心！
                    if (virtualFS[fileName]) {
                        console.log(`%c[VFS 攔截命中!!] ${url} >>> 轉向記憶體資料流 >>> ${virtualFS[fileName].rawUrl}`, "color: #00bb00; font-weight: bold;");
                        return virtualFS[fileName].rawUrl; 
                    }
                } catch(e) {
                    const fileName = url.split('?')[0].split('/').pop().toLowerCase();
                    if (virtualFS[fileName]) return virtualFS[fileName].rawUrl;
                }
                
                console.warn(`[VFS 漏空放行]: ${url}`);
                return url;
            };

            return player;
        }

        launchBtn.addEventListener("click", () => {
            const selectedKey = mainSelect.value; // 拿到例如 "main.swf"
            if (!selectedKey) return alert("Please select a target BLOB.");

            const targetAsset = virtualFS[selectedKey];
            if (targetAsset) {
                const player = initNewPlayer();
                
                // 🌟 使用 FileReader 轉成 ArrayBuffer 二進位投餵，消滅 file:// 協定安全報錯
                const reader = new FileReader();
                reader.onload = (e) => {
                    const arrayBuffer = e.target.result;
                    
                    console.log(`%c[VFS Booting] 鎖定 Ruffle 的 Base URL 虛擬起點為: ${targetAsset.displayUrl}`, "color: #0088cc; font-weight: bold;");
                    
                    // 將主要 SWF 投餵進去，並指定它的起點就在指定的虛擬網址上
                    player.load({
                        data: arrayBuffer,
                        url: targetAsset.displayUrl, // 完美基底：blob:https://flash.nins.cc/main.swf
                        allowScriptAccess: true
                    });
                };
                
                reader.readAsArrayBuffer(targetAsset.blob);
            }
        });
    </script>
</body>
</html>
