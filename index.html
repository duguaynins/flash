<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>VFS Ruffle Player</title>
    <script src="./static/js/ruffle.js"></script>
    <style>
        /* 嚴格恢復 DOS 風格：白底、黑線、單色調 */
        body { margin: 0; padding: 40px; font-family: 'Courier New', Courier, monospace; background: #fff; color: #000; }
        .card { width: 900px; margin: auto; border: 2px solid #000; padding: 30px; box-sizing: border-box; }
        .panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .btn { border: 2px solid #000; background: #fff; padding: 10px; cursor: pointer; font-family: inherit; font-weight: bold; }
        .btn:hover { background: #000; color: #fff; }
        #player-container { width: 100%; aspect-ratio: 4/3; border: 2px solid #000; margin-top: 20px; background: #fff; }
        #player-container ruffle-player { width: 100%; height: 100%; display: block; }
        select { border: 2px solid #000; padding: 8px; font-family: inherit; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="border-bottom: 2px solid #000; padding-bottom: 10px;">VIRTUAL FILE SYSTEM PLAYER</h2>
    <div class="panel">
        <div>
            <label>1. LOAD ASSETS</label><br><br>
            <input type="file" id="file-input" multiple>
        </div>
        <div>
            <label>2. SELECT & EXECUTE</label><br><br>
            <select id="main-select"></select>
            <button class="btn" id="launch-btn">LAUNCH</button>
        </div>
    </div>
    <div id="player-container"></div>
</div>

<script>
    const vfs = new Map();
    const BASE_URL = "https://flash.nins.cc/";

    document.getElementById('file-input').addEventListener('change', e => {
        const select = document.getElementById('main-select');
        [...e.target.files].forEach(f => {
            const blobUrl = URL.createObjectURL(f);
            vfs.set(f.name.toLowerCase(), blobUrl);
            if(f.name.toLowerCase().endsWith('.swf')) {
                select.add(new Option(f.name, f.name.toLowerCase()));
            }
        });
    });

    document.getElementById('launch-btn').addEventListener('click', () => {
        const key = document.getElementById('main-select').value;
        const container = document.getElementById('player-container');
        container.innerHTML = "";
        
        const player = window.RufflePlayer.newest().createPlayer();
        container.appendChild(player);

        // [標準化架構]：Normalize -> Lookup -> Map
        player.onInterceptURLLoad = (url) => {
            const normalized = new URL(url, BASE_URL).href;
            const name = normalized.split('/').pop().split('?')[0].toLowerCase();
            if (vfs.has(name)) {
                console.log(`[VFS Mapped]: ${name} -> ${vfs.get(name)}`);
                return vfs.get(name);
            }
            return url;
        };

        player.load({ 
            url: vfs.get(key),
            baseUrl: BASE_URL 
        });
    });
</script>
</body>
</html>
