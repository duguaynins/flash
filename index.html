<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruffle VFS Player - Final Solution</title>
<script src="./static/js/ruffle.js"></script>
<style>
    body { font-family: sans-serif; padding: 40px; display: flex; justify-content: center; }
    .player-card { width: 100%; max-width: 900px; border: 1px solid #000; padding: 20px; }
    .control-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .btn { border: 1px solid #000; background: white; padding: 10px; cursor: pointer; }
    #player-container { margin-top: 20px; width: 100%; aspect-ratio: 4/3; border: 1px solid #000; }
    #player-container ruffle-player { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>

<div class="player-card">
    <h2>Flash VFS Manager</h2>
    <div class="control-panel">
        <div>
            <label>Step 1: Upload Files</label><br>
            <input type="file" id="files-input" multiple>
            <div id="cache-info">[VFS Empty]</div>
        </div>
        <div>
            <label>Step 2: Launch</label><br>
            <select id="main-select" disabled></select>
            <button class="btn" id="launch-btn" disabled>Launch</button>
        </div>
    </div>
    <div id="player-container"></div>
</div>

<script>
const virtualFS = {};
const baseOrigin = "https://flash.nins.cc/";
const container = document.getElementById("player-container");
const filesInput = document.getElementById("files-input");
const mainSelect = document.getElementById("main-select");
const launchBtn = document.getElementById("launch-btn");
const cacheInfo = document.getElementById("cache-info");

// 1. 註冊檔案至 VFS
filesInput.addEventListener("change", (e) => {
    [...e.target.files].forEach(file => {
        const key = file.name.toLowerCase();
        if(virtualFS[key]) URL.revokeObjectURL(virtualFS[key].rawUrl);
        
        virtualFS[key] = {
            rawUrl: URL.createObjectURL(file)
        };

        if(key.endsWith(".swf")) {
            let option = document.createElement("option");
            option.value = key;
            option.textContent = key;
            mainSelect.appendChild(option);
        }
    });
    cacheInfo.innerText = `[Mounted ${Object.keys(virtualFS).length} Files]`;
    mainSelect.disabled = false;
    launchBtn.disabled = false;
});

// 2. 初始化播放器並強制映射
function initPlayer() {
    container.innerHTML = "";
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    container.appendChild(player);

    // 關鍵攔截器：強制將所有請求錨定到 baseOrigin 後再比對
    player.onInterceptURLLoad = (url) => {
        try {
            const urlObj = new URL(url, baseOrigin);
            const fileName = urlObj.pathname.split('/').pop().toLowerCase();
            
            if (virtualFS[fileName]) {
                console.log(`[Mapping] ${fileName} -> ${virtualFS[fileName].rawUrl}`);
                return virtualFS[fileName].rawUrl;
            }
        } catch(e) {
            console.error("URL解析錯誤:", url);
        }
        return url;
    };
    return player;
}

launchBtn.addEventListener("click", () => {
    const key = mainSelect.value;
    const asset = virtualFS[key];
    const player = initPlayer();

    // 強制設定 baseUrl，讓 Ruffle 知道所有相對路徑都要問我們
    player.load({
        url: asset.rawUrl,
        baseUrl: baseOrigin,
        allowScriptAccess: true
    });
});
</script>
</body>
</html>
