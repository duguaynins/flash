<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruffle VFS Player - Perfect Map Test</title>

<style>
:root { --bg:#fff; --text:#000; --border:#000; --dim:#777; --h:38px; }
body { margin:0; padding:40px 20px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; display:flex; justify-content:center; background:#fff; }
.player-card { width:100%; max-width:900px; border:1px solid black; padding:30px; box-sizing:border-box; }
.control-panel { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
.control-section { display:flex; flex-direction:column; }
label { font-size:11px; font-weight:bold; margin-bottom:5px; }
.input-group { display:flex; height:var(--h); box-sizing:border-box; }
.btn { border:1px solid black; background:white; cursor:pointer; padding:0 16px; font-size:11px; font-weight:bold; display:inline-flex; align-items:center; justify-content:center; height:100%; }
.btn:hover { background:black; color:white; }
#player-container { margin-top:20px; width:100%; aspect-ratio:4/3; border:1px solid black; display:flex; justify-content:center; align-items:center; overflow:hidden; }
#player-container ruffle-player { width:100%; height:100%; display:block; }
</style>
<script src="./static/js/ruffle.js"></script>
</head>
<body>

<div class="player-card">
    <h2>Flash BLOB Smart Mapping Test</h2>
    <div class="control-panel">
        <div class="control-section">
            <label>Step 1: Mount Files</label>
            <div class="input-group">
                <label class="btn">
                    <input id="files-input" type="file" multiple accept=".swf" style="display:none;">
                    Upload SWF Files
                </label>
            </div>
        </div>
        <div class="control-section">
            <label>Step 2: Launch</label>
            <div class="input-group">
                <select id="main-select" disabled><option value="">[Select Target]</option></select>
                <button class="btn" id="launch-btn" disabled>Launch</button>
            </div>
        </div>
    </div>
    <div id="player-container"></div>
</div>

<script>
const vfs = new Map();
const BASE_URL = "https://flash.nins.cc/";

// 1. 檔案掛載
document.getElementById("files-input").addEventListener("change", (e) => {
    [...e.target.files].forEach(file => {
        const key = file.name.toLowerCase();
        vfs.set(key, URL.createObjectURL(file));
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = key;
        document.getElementById("main-select").appendChild(opt);
    });
    document.getElementById("main-select").disabled = false;
    document.getElementById("launch-btn").disabled = false;
});

// 2. 啟動播放器
document.getElementById("launch-btn").addEventListener("click", () => {
    const key = document.getElementById("main-select").value;
    const container = document.getElementById("player-container");
    container.innerHTML = "";
    
    const player = window.RufflePlayer.newest().createPlayer();
    container.appendChild(player);

    // 核心攔截器：同時處理主檔與次檔映射
    player.onInterceptURLLoad = (url) => {
        const name = url.split('/').pop().split('?')[0].toLowerCase();
        if (vfs.has(name)) {
            console.log(`%c[VFS Hit]: ${name}`, "color: green; font-weight: bold;");
            return vfs.get(name);
        }
        return url;
    };

    // 強制設定 baseUrl，觸發攔截機制
    player.load({
        url: key, 
        baseUrl: BASE_URL,
        allowScriptAccess: true
    });
});
</script>
</body>
</html>
