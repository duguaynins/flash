<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruffle VFS Player</title>
    
    <script src="./static/js/ruffle.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #000000;
            --accent-dim: #767676;
            --success-color: #0088cc;
            --height-unit: 38px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .player-card {
            width: 100%;
            max-width: 800px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 30px;
            box-sizing: border-box;
        }

        h2 {
            margin: 0 0 24px 0;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 雙欄控制面板 */
        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 600px) {
            .control-panel { grid-template-columns: 1fr; gap: 16px; }
        }

        .control-section {
            display: flex;
            flex-direction: column;
        }

        .control-section label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .input-group {
            display: flex;
            width: 100%;
            height: var(--height-unit);
            box-sizing: border-box;
        }

        input[type="text"] {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-right: none;
            color: var(--text-color);
            font-family: inherit;
            padding: 0 12px;
            flex-grow: 1;
            font-size: 13px;
            outline: none;
            height: 100%;
            box-sizing: border-box;
        }

        input[type="file"] { display: none; }

        .btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            font-family: inherit;
            padding: 0 16px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            box-sizing: border-box;
            transition: background-color 0.1s, color 0.1s;
        }

        .btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        .file-label { width: 100%; height: 100%; margin: 0 !important; }

        /* 快取狀態提示文字 */
        .cache-status {
            font-size: 11px;
            color: var(--accent-dim);
            margin-top: 6px;
            font-style: italic;
        }

        /* 播放器區域 */
        #player-container {
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .placeholder-text {
            color: var(--accent-dim);
            font-size: 11px;
            letter-spacing: 1px;
        }

        #player-container ruffle-player { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>Flash VFS Controller</h2>

        <div class="control-panel">
            
            <div class="control-section">
                <label>Step 1: Cache Dependency Files (Optional)</label>
                <div class="input-group">
                    <label class="btn file-label">
                        <input type="file" id="cache-input" accept=".swf,.mp3,.xml" multiple>
                        Inject Assets into Cache
                    </label>
                </div>
                <div class="cache-status" id="cache-info">[ Memory Cache Empty ]</div>
            </div>
            
            <div class="control-section">
                <label for="url-input">Step 2: Execute Main SWF</label>
                <div class="input-group">
                    <input type="text" id="url-input" placeholder="Enter URL or Select File -->">
                    <label class="btn" style="border-left: none; border-right: none;">
                        <input type="file" id="main-file-input" accept=".swf">
                        File
                    </label>
                    <button class="btn" id="load-url-btn">URL</button>
                </div>
            </div>

        </div>

        <div id="player-container">
            <div class="placeholder-text">[ AWAITING SWF INPUT ]</div>
        </div>
    </div>

    <script>
        // 全域虛擬檔案快取地圖
        const virtualFS = {};

        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            publicPath: "./static/js/",
            letterbox: "on",         
            scale: "showAll",        
            forceScale: true,
            quality: "high"          
        };

        const container = document.getElementById("player-container");

        // 處理步驟一：將多選的相依素材塞進瀏覽器記憶體快取
        document.getElementById("cache-input").addEventListener("change", (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            files.forEach(file => {
                const blobURL = URL.createObjectURL(file);
                // 用小寫檔名做 Key，例如：virtualFS["level1.swf"] = "blob:http..."
                virtualFS[file.name.toLowerCase()] = blobURL;
            });

            document.getElementById("cache-info").innerText = `[ Caching ${Object.keys(virtualFS).length} Asset(s) in Memory ]`;
            document.getElementById("cache-info").style.color = "var(--success-color)";
        });

        // 核心：初始化播放器並設置攔截器
        function initNewPlayer() {
            container.innerHTML = "";
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            container.appendChild(player);

            // 🌟 核心魔法：攔截 Ruffle 內部的所有網路請求！
            // 當 Flash 試圖載入相對路徑的素材時，強制讓它去撈我們快取的 BlobURL
            player.onInterceptURLLoad = (url) => {
                // 取得檔案名稱（例如從 "http://localhost/level1.swf" 切出 "level1.swf"）
                const fileName = url.split('/').pop().toLowerCase();
                
                if (virtualFS[fileName]) {
                    console.log(`[VFS Hit] Redirecting request for ${fileName}`);
                    return virtualFS[fileName]; // 命中快取，重導向至記憶體檔案
                }
                return url; // 沒命中，走原本的網路請求
            };

            return player;
        }

        // 處理步驟二：遠端網址載入
        document.getElementById("load-url-btn").addEventListener("click", () => {
            const url = document.getElementById("url-input").value.trim();
            if (url) {
                const player = initNewPlayer();
                player.load({ url: url });
            } else {
                alert("Please enter a URL.");
            }
        });

        // 處理步驟二：本地主檔案載入
        document.getElementById("main-file-input").addEventListener("change", (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const player = initNewPlayer();
                    player.load({
                        data: e.target.result,
                        allowScriptAccess: true
                    });
                };
                reader.readAsArrayBuffer(file);
            }
        });
    </script>
</body>
</html>
