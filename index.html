<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruffle VFS Player - Standard</title>
    
    <script src="./static/js/ruffle.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #000000;
            --accent-dim: #767676;
            --success-color: #0088cc;
            --height-unit: 38px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .player-card {
            width: 100%;
            max-width: 800px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 30px;
            box-sizing: border-box;
        }

        h2 {
            margin: 0 0 24px 0;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 雙欄一體化控制面板 */
        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 600px) {
            .control-panel { grid-template-columns: 1fr; gap: 16px; }
        }

        .control-section {
            display: flex;
            flex-direction: column;
        }

        .control-section label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .input-group {
            display: flex;
            width: 100%;
            height: var(--height-unit);
            box-sizing: border-box;
        }

        /* 極簡下拉選單樣式 */
        select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-right: none; /* 拔掉右邊線，與執行按鈕完美結合 */
            color: var(--text-color);
            font-family: inherit;
            padding: 0 12px;
            flex-grow: 1;
            font-size: 13px;
            outline: none;
            height: 100%;
            box-sizing: border-box;
            cursor: pointer;
            border-radius: 0;
            -webkit-appearance: none; /* 移除原生的下拉箭頭以符合極簡風 */
            appearance: none;
        }

        input[type="file"] { display: none; }

        .btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            font-family: inherit;
            padding: 0 16px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            box-sizing: border-box;
            transition: background-color 0.1s, color 0.1s;
        }

        .btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        .file-label { width: 100%; height: 100%; margin: 0 !important; }

        .cache-status {
            font-size: 11px;
            color: var(--accent-dim);
            margin-top: 6px;
            font-style: italic;
        }

        /* 播放器區域（鎖定 4:3 比例） */
        #player-container {
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .placeholder-text {
            color: var(--accent-dim);
            font-size: 11px;
            letter-spacing: 1px;
        }

        #player-container ruffle-player { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>Flash VFS Controller</h2>

        <div class="control-panel">
            
            <div class="control-section">
                <label>Step 1: Mount All Game Files</label>
                <div class="input-group">
                    <label class="btn file-label">
                        <input type="file" id="assets-input" accept=".swf,.mp3,.xml" multiple>
                        Select & Load All Files
                    </label>
                </div>
                <div class="cache-status" id="cache-info">[ VFS Drive Unmounted ]</div>
            </div>
            
            <div class="control-section">
                <label for="main-select">Step 2: Launch Main SWF</label>
                <div class="input-group">
                    <select id="main-select" disabled>
                        <option value="">[ Select Target SWF ]</option>
                    </select>
                    <button class="btn" id="launch-btn" disabled>Launch</button>
                </div>
            </div>

        </div>

        <div id="player-container">
            <div class="placeholder-text">[ AWAITING VFS DRIVE MOUNT ]</div>
        </div>
    </div>

    <script>
        // 核心對照表：記錄「原始檔名 (小寫)」與「Blob 虛擬路徑」的映射關係
        const virtualFS = {};

        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            publicPath: "./static/js/",
            letterbox: "on",         
            scale: "showAll",        
            forceScale: true,
            quality: "high"          
        };

        const container = document.getElementById("player-container");
        const assetsInput = document.getElementById("assets-input");
        const mainSelect = document.getElementById("main-select");
        const launchBtn = document.getElementById("launch-btn");
        const cacheInfo = document.getElementById("cache-info");

        // 監聽 Step 1：將使用者選取的所有檔案全部塞入 Blob 記憶體，並記住名稱對照
        assetsInput.addEventListener("change", (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            // 清空舊的虛擬檔案系統與選單
            for (let key in virtualFS) {
                URL.revokeObjectURL(virtualFS[key]); // 釋放舊記憶體指標
                delete virtualFS[key];
            }
            mainSelect.innerHTML = '<option value="">[ Select Target SWF ]</option>';

            // 開始將所有檔案建立 Blob URL 映射
            files.forEach(file => {
                const blobURL = URL.createObjectURL(file);
                const lowerName = file.name.toLowerCase();
                
                // 記得原始名稱與 BLOB 的對應
                virtualFS[lowerName] = blobURL;

                // 如果是 .swf 檔案，將原始名稱塞入 Step 2 的下拉選單供使用者選擇
                if (lowerName.endsWith('.swf')) {
                    const option = document.createElement("option");
                    option.value = lowerName; // Value 綁定原始檔名 key
                    option.textContent = file.name; // 顯示原始檔名
                    mainSelect.appendChild(option);
                }
            });

            const totalCached = Object.keys(virtualFS).length;
            if (totalCached > 0) {
                cacheInfo.innerText = `[ Successfully Mounted ${totalCached} Files ]`;
                cacheInfo.style.color = "var(--success-color)";
                // 解除鎖定第二步的選單與按鈕
                mainSelect.disabled = false;
                launchBtn.disabled = false;
            }
        });

        // 核心：建立帶有 VFS 網址攔截器的 Ruffle 實例
        function initNewPlayer() {
            container.innerHTML = "";
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            container.appendChild(player);

            // 網址攔截魔法：當主要 SWF 執行過程中需要呼叫其他依賴檔案時觸發
            player.onInterceptURLLoad = (url) => {
                // 擷取請求網址最後的原始檔名
                const fileName = url.split('/').pop().toLowerCase();
                
                // 透過「原始名稱」比對，如果存在於對照表中，就把對應的 Blob 虛擬路徑丟回給 Ruffle
                if (virtualFS[fileName]) {
                    console.log(`[VFS Linked] ${fileName} -> ${virtualFS[fileName]}`);
                    return virtualFS[fileName]; 
                }
                return url; 
            };

            return player;
        }

        // 監聽 Step 2：點擊 Launch 按鈕執行選定的主要檔案
        launchBtn.addEventListener("click", () => {
            const selectedFileName = mainSelect.value;
            
            if (!selectedFileName) {
                alert("Please select a main SWF file to launch.");
                return;
            }

            // 透過玩家在選單中挑選的「原始檔名」，去對照表找出對應的 Blob 虛擬網址
            const mainBlobUrl = virtualFS[selectedFileName];
            
            if (mainBlobUrl) {
                const player = initNewPlayer();
                // 讓 Ruffle 直接加載這個主要檔案的 Blob 虛擬路徑
                player.load({ url: mainBlobUrl });
                console.log(`Launching Main SWF via VFS Map: ${selectedFileName}`);
            }
        });
    </script>
</body>
</html>
